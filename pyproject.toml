[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logicflow"
version = "1.2.0"
description = "Source Code Visualizer & Dual-Mode Diagram Generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Anas Fikri", email = "anas.fikri@example.com"}]
keywords = ["code-visualization", "diagram", "ast", "flowchart", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Visualization",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "mypy>=1.0.0"]

[project.scripts]
logicflow = "logicflow.__main__:main"

[project.urls]
Homepage = "https://github.com/anas-fikri/logicflow"
Repository = "https://github.com/anas-fikri/logicflow.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["logicflow*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
